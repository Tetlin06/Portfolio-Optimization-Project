name: Single-stock winner 20y research

on:
  push:
    branches:
      - single-stock-winner-20y-20260902

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe Quandl WIKI historical endpoints
        run: |
          for s in RX QLGC TSO GNW NVDA; do
            echo "===== $s ====="
            curl -L -sS --max-time 30 "https://data.nasdaq.com/api/v3/datasets/WIKI/${s}.csv?start_date=2005-01-01&end_date=2011-01-01" | head -5
          done
