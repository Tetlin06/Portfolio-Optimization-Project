name: Single-stock winner 20y research

on:
  push:
    branches:
      - single-stock-winner-20y-20260902

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe Stooq symbol CSV endpoint
        run: |
          for s in rx qlgc andv gnw nvda; do
            echo "===== $s ====="
            curl -L -sS --max-time 30 "https://stooq.com/q/d/l/?s=${s}.us&d1=20050101&d2=20110101&i=d" | head -5
          done
