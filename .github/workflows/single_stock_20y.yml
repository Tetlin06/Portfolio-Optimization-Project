name: Single-stock winner 20y research

on:
  push:
    branches:
      - single-stock-winner-20y-20260902

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow huggingface_hub yfinance requests openpyxl
          python -m pip install git+https://github.com/arielNacamulli/pitindex.git
      - name: Rank candidates
        run: python single_stock_candidates_fast.py
      - name: Upload candidate outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-stock-candidates
          path: single_stock_candidates/
          retention-days: 7
