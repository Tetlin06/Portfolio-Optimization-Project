name: Single-stock winner 20y research

on:
  push:
    branches:
      - single-stock-winner-20y-20260902

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect StockQuote application endpoints
        run: |
          curl -L -sS --max-time 30 https://stockquote.io/ -o /tmp/page.html
          echo '--- scripts ---'
          grep -oE 'src="[^"]+\.js[^" ]*"' /tmp/page.html || true
          echo '--- api strings ---'
          grep -oE 'https?://[^"'"'"' ]+|/api/[A-Za-z0-9_?&=./{}:-]+' /tmp/page.html | sort -u | head -100 || true
          cat /tmp/page.html | head -80
