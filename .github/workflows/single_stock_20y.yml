name: Single-stock winner 20y research

on:
  push:
    branches:
      - single-stock-winner-20y-20260902

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas
      - name: Download Stooq US history
        run: |
          wget -nv --timeout=60 --tries=3 https://static.stooq.com/db/h/d_us_txt.zip -O /tmp/d_us_txt.zip
          ls -lh /tmp/d_us_txt.zip
      - name: Probe Stooq histories
        run: python stooq_probe.py
