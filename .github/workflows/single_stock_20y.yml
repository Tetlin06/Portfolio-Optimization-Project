name: Single-stock winner 20y research

on:
  push:
    branches:
      - single-stock-winner-20y-20260902

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow huggingface_hub yfinance requests openpyxl
          python -m pip install git+https://github.com/arielNacamulli/pitindex.git
      - name: Run identity audit
        run: |
          sed -i 's/range(2005,2026)/range(2004,2026)/' single_stock_audit.py
          python single_stock_audit.py
      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-stock-identity-audit
          path: single_stock_audit/
          retention-days: 7
