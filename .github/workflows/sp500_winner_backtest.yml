name: Corrected momentum versus index research

on:
  push:
    branches:
      - chatgpt-sp500-winner-backtest-20260901

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy yfinance requests
      - name: Run corrected momentum research
        run: python momentum_research_backtest.py
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: momentum-research-results
          path: momentum_outputs/
          retention-days: 7
